databases:
  - name: Balletto # Nome de referência do recurso de DB (usado em 'fromDatabase')
    databaseName: ballettodb
    user: ballettouser
    plan: free

services:
  - type: web
    name: Balletto
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    # preDeployCommand: "bundle exec rails db:migrate" # preDeployCommand only available on paid instance types
    startCommand: "bundle exec rails db:migrate && bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: Balletto # Deve referenciar o 'name' do banco de dados (Balletto)
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false # Corrigido: deve ser um item de lista separado
      - key: WEB_CONCURRENCY
        value: 2 # sensible default
