# Arquivo de tradução para Português Brasileiro (pt-BR)
# Inclui traduções do Devise e mensagens do ActiveRecord
pt-BR:
  devise:
    failure:
      already_authenticated: 'Você já está logado.'
      invalid: 'Usuário ou senha inválidos.'
      invalid_token: 'Token de autenticação inválido.'
      locked: 'Sua conta está bloqueada.'
      last_attempt: 'Você tem mais uma tentativa antes de sua conta ser bloqueada.'
      not_found_in_database: 'Usuário ou senha inválidos.'
      timeout: 'Sua sessão expirou. Por favor, faça login novamente para continuar.'
      unauthenticated: ''
      unconfirmed: 'Você precisa confirmar seu e-mail antes de continuar.'

    sessions:
      signed_in: 'Login efetuado com sucesso.'
      signed_out: 'Logout efetuado com sucesso.'
      already_signed_out: 'Logout efetuado com sucesso.'

    passwords:
      no_token: "Você só pode acessar esta página através de um e-mail de redefinição de senha."
      send_instructions: 'Dentro de alguns minutos, você receberá um e-mail com instruções para redefinir sua senha.'
      send_paranoid_instructions: "Se o seu e-mail existir em nossa base de dados, você receberá um link de recuperação de senha em alguns minutos."
      updated: 'Sua senha foi alterada com sucesso. Você já está logado.'
      updated_not_active: 'Sua senha foi alterada com sucesso.'

    confirmations:
      confirmed: 'Seu e-mail foi confirmado com sucesso.'
      send_instructions: 'Dentro de alguns minutos, você receberá um e-mail com instruções para confirmar sua conta.'
      send_paranoid_instructions: 'Se o seu e-mail existir em nossa base de dados, você receberá instruções de como confirmar sua conta em alguns minutos.'

    registrations:
      signed_up: 'Bem-vindo! Você se registrou com sucesso.'
      signed_up_but_inactive: 'Você se registrou com sucesso, mas sua conta ainda não está ativada.'
      signed_up_but_locked: 'Você se registrou com sucesso, mas sua conta está bloqueada.'
      signed_up_but_unconfirmed: 'Um link de confirmação foi enviado para o seu e-mail. Verifique e confirme sua conta.'
      update_needs_confirmation: 'Você atualizou seu e-mail com sucesso, mas precisa confirmá-lo. Verifique seu e-mail para completar a alteração.'
      updated: 'Sua conta foi atualizada com sucesso.'
      destroyed: 'Adeus! Sua conta foi cancelada com sucesso. Esperamos vê-lo novamente em breve.'

    unlocks:
      send_instructions: 'Dentro de alguns minutos, você receberá um e-mail com instruções para desbloquear sua conta.'
      send_paranoid_instructions: 'Se sua conta existir, você receberá um e-mail com instruções para desbloqueá-la em alguns minutos.'
      unlocked: 'Sua conta foi desbloqueada com sucesso. Por favor, faça login para continuar.'

  errors:
    format: "%{attribute} %{message}"
    messages:
      already_confirmed: "já foi confirmado, por favor, tente fazer login"
      confirmation_period_expired: "precisa ser confirmado em %{period}, por favor, solicite um novo"
      expired: "expirou, por favor, solicite um novo"
      not_found: "não encontrado"
      not_locked: "não estava bloqueado"
      not_saved:
        one: "1 erro impediu este %{resource} de ser salvo:"
        other: "%{count} erros impediram este %{resource} de ser salvo:"
      blank: "não pode ficar em branco"
      too_long: "é muito longo (máximo %{count} caracteres)"
      too_short: "é muito curto (mínimo %{count} caracteres)"
      taken: "já está em uso"
      invalid: "não é válido"

  activerecord:
    attributes:
      evento:
        EVE_NOME: "Nome do Evento"
        EVE_DATA: "Data e Hora"
        EVE_LOCAL: "Local do Evento"
        EVE_DESC: "Descrição"

    errors:
      models:
        evento:
          attributes:
            EVE_NOME:
              blank: "não pode ficar em branco"
            EVE_DATA:
              blank: "não pode ficar em branco"
            EVE_LOCAL:
              blank: "não pode ficar em branco"
            EVE_DESC:
              blank: "não pode ficar em branco"
              too_long: "é muito longa (máximo %{count} caracteres)"

        configuracao:
          attributes:
            dia_vencimento_mensalidade:
              less_than_or_equal_to: "deve ser menor ou igual a %{count}"
              greater_than_or_equal_to: "deve ser maior ou igual a %{count}"
