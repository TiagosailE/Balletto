
default: &default
  adapter: postgresql
  encoding: unicode
  username:
  password:
  host: localhost
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: balletto_core_development

test:
  <<: *default
  database: balletto_core_test

production:
  primary: &primary_production
    <<: *default
    database: balletto_core_production
    username: balletto_core
    password: <%= ENV["BALLETTO_CORE_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: balletto_core_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: balletto_core_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: balletto_core_production_cable
    migrations_paths: db/cable_migrate
