default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch("DB_USERNAME") { 'seu_fallback_user' } %>
  password: <%= ENV.fetch("DB_PASSWORD") { 'sua_fallback_senha' } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: balletto_core_development

test:
  <<: *default
  database: balletto_core_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>